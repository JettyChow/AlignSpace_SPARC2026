name: Test and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Runs on every PR and every push to main ──
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Backend lint + tests
        run: |
          cd as-ai-server
          pip install -r requirements.txt
          ruff check .
          pytest

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Frontend lint
        run: |
          cd frontend
          npm ci
          npm run lint

  # ── main only: build Next.js on GitHub's 7GB runner, not the 4GB Droplet ──
  build-frontend:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build standalone bundle
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_POSTHOG_KEY: ${{ secrets.NEXT_PUBLIC_POSTHOG_KEY }}
        run: |
          cd frontend
          npm ci
          npm run build
          cp -r .next/static .next/standalone/.next/static
          cp -r public .next/standalone/public

      - uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: frontend/.next/standalone

  # ── main only: ship it ──
  deploy:
    needs: build-frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: web-build
          path: web-build

      - name: Rsync frontend bundle to Droplet
        uses: easingthemes/ssh-deploy@v5
        with:
          SSH_PRIVATE_KEY: ${{ secrets.DROPLET_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.DROPLET_IP }}
          REMOTE_USER: deploy
          SOURCE: "web-build/"
          TARGET: "/var/www/AlignSpace_SPARC2026/frontend"

      - name: Update backend, migrate, restart services
        uses: appleboy/ssh-action@v1        # version-pinned, never @master
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: deploy
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script: |
            set -e
            cd /var/www/AlignSpace_SPARC2026
            git pull origin main

            cd as-ai-server
            source venv/bin/activate
            pip install -r requirements.txt
            alembic upgrade head

            sudo systemctl restart designos-api
            sudo systemctl restart designos-worker
            sudo systemctl restart designos-web

            echo "✓ Deployment complete"